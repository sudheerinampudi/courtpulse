<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtPulse: who's playing near you</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#F6F8EF;--ring:#DCE5D0;--ink:#15332B;--muted:#5E7168;--outline:#B4C4AA;--lime:#D9F24A;--green:#1F6B3F;--empty:#D3DCC8;--live:#1F9D55}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.sg,h1{font-family:'Space Grotesk',sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.head{display:flex;align-items:center;gap:10px}.head img{border-radius:9px}
.seg{display:flex;background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:24px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:20px;background:transparent;color:var(--ink);font:600 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.card{background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}.big{font:700 64px/1 'Space Grotesk';color:var(--green);letter-spacing:-.03em}
.num{font:700 30px 'Space Grotesk';color:var(--green)}
.bar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.btn{min-height:52px;border:none;border-radius:16px;background:var(--lime);color:#0F2A24;font:700 16px 'Space Grotesk';cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--live);font-weight:600}.live:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--live)}
a.lnk{color:var(--green);font:600 13px Inter}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://wjedvyqtqgvclxxsxyox.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EDOf8NAuJK8AbWhDLKzjmQ_gNcBpSb6';
const PB='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFA03A" stroke="#15332B" stroke-width="1.5"/><g fill="#15332B"><circle cx="12" cy="7" r="1.4"/><circle cx="7.4" cy="10.4" r="1.4"/><circle cx="16.6" cy="10.4" r="1.4"/><circle cx="9.2" cy="15.8" r="1.4"/><circle cx="14.8" cy="15.8" r="1.4"/><circle cx="12" cy="12" r="1.4"/></g></svg>';
const TN='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D5E83A" stroke="#15332B" stroke-width="1.5"/><path d="M4.4 6.6c4.4 3.2 4.4 7.6 0 10.8M19.6 6.6c-4.4 3.2-4.4 7.6 0 10.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
let prefs={sport:'pickleball'};try{Object.assign(prefs,JSON.parse(localStorage.getItem('cn-prefs')||'{}'))}catch(e){}
if(prefs.sport!=='tennis')prefs.sport='pickleball';
const savePrefs=()=>{try{const c=JSON.parse(localStorage.getItem('cn-prefs')||'{}')||{};localStorage.setItem('cn-prefs',JSON.stringify({...c,sport:prefs.sport}))}catch(e){}};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rows=null,err='',updated=null;
async function load(){
  const {data,error}=await sb.rpc('park_counts',{p_sport:prefs.sport});
  if(error){err=error.message;rows=rows||[]}else{err='';rows=data;updated=new Date()}
  render();
}
function render(){
  const tot=(rows||[]).reduce((a,r)=>a+Number(r.avg_playing),0);
  let h=`<div class="head"><img src="icon.png" alt="" width="36" height="36"><b class="sg" style="font-size:20px">CourtPulse</b></div>
  <div class="seg" role="group" aria-label="Sport"><button aria-pressed="${prefs.sport==='pickleball'}" data-sport="pickleball">${PB}Pickleball</button><button aria-pressed="${prefs.sport==='tennis'}" data-sport="tennis">${TN}Tennis</button></div>
  <div><div class="muted"><span class="live">Live</span> · playing now at all parks</div><div class="big">${rows?tot:'…'}</div></div>`;
  if(err)h+=`<div class="card" role="alert"><b>Couldn't load counts</b><div class="muted">${esc(err)}</div></div>`;
  else if(rows&&!rows.length)h+='<div class="muted">No parks for this sport yet.</div>';
  (rows||[]).forEach(r=>{const mx=r.courts*4,n=Number(r.avg_playing);
    h+=`<a class="card" href="checkin.html?park=${encodeURIComponent(r.slug)}"><div class="row"><b class="sg" style="font-size:16px">${esc(r.name)}</b><span class="num">${n}</span></div><div class="muted">${r.courts} courts · ${Number(r.avg_waiting)} waiting · ${Number(r.report_count)?Number(r.report_count)+' report'+(r.report_count==1?'':'s')+' in last 10 min':'no recent reports'}</div><div class="bar"><i style="width:${Math.min(100,n/mx*100)}%"></i></div></a>`});
  h+=`<a class="btn" href="checkin.html?park=lakeside">Check in</a><div class="muted" style="text-align:center">Averages of player reports from the last 10 minutes. Refreshes every 30 seconds.</div><div class="muted" style="text-align:center"><a class="lnk" href="prototype.html">Design prototype</a></div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();rows=null;render();load()});
}
render();load();setInterval(load,30000);
</script></body></html>
