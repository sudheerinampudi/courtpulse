<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtPulse: who's playing near you</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--page:#F6F8EF;--ring:#DCE5D0;--ink:#15332B;--muted:#5E7168;--outline:#B4C4AA;--lime:#D9F24A;--green:#1F6B3F;--empty:#D3DCC8;--live:#1F9D55}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.sg,h1{font-family:'Space Grotesk',sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.head{display:flex;align-items:center;gap:10px}.head img{border-radius:9px}
.seg{display:flex;background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:24px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:20px;background:transparent;color:var(--ink);font:600 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.card{background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:13px}.big{font:700 64px/1 'Space Grotesk';color:var(--green);letter-spacing:-.03em}
.num{font:700 30px 'Space Grotesk';color:var(--green)}
.bar{height:8px;border-radius:4px;background:var(--empty);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.btn{min-height:52px;border:none;border-radius:16px;background:var(--lime);color:#0F2A24;font:700 16px 'Space Grotesk';cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--live);font-weight:600}.live:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--live)}
a.lnk,button.lnk{color:var(--green);font:600 13px Inter;background:none;border:none;padding:0;cursor:pointer;text-decoration:underline}
.zip{display:flex;gap:8px}.zip input{flex:1;min-height:48px;border:1px solid var(--outline);border-radius:12px;padding:0 14px;font:400 16px Inter;background:#fff;color:var(--ink)}.zip .go{min-height:48px;padding:0 16px;border:none;border-radius:12px;background:var(--lime);color:#0F2A24;font:700 15px 'Space Grotesk';cursor:pointer}
.feat{gap:10px;padding:18px}.row2{display:flex;gap:36px;align-items:flex-end}
.mapbox{height:380px;border-radius:18px;box-shadow:0 0 0 1px var(--ring);overflow:hidden}.mpin{background:var(--lime);color:#0F2A24;font:700 15px 'Space Grotesk';border-radius:16px;min-width:44px;height:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.chips{display:flex;gap:6px}.chips button{flex:1;min-height:40px;border:1px solid var(--outline);background:#fff;border-radius:20px;font:600 13px Inter;color:var(--ink);cursor:pointer}.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
</style></head><body><main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://wjedvyqtqgvclxxsxyox.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EDOf8NAuJK8AbWhDLKzjmQ_gNcBpSb6';
const PB='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFA03A" stroke="#15332B" stroke-width="1.5"/><g fill="#15332B"><circle cx="12" cy="7" r="1.4"/><circle cx="7.4" cy="10.4" r="1.4"/><circle cx="16.6" cy="10.4" r="1.4"/><circle cx="9.2" cy="15.8" r="1.4"/><circle cx="14.8" cy="15.8" r="1.4"/><circle cx="12" cy="12" r="1.4"/></g></svg>';
const TN='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D5E83A" stroke="#15332B" stroke-width="1.5"/><path d="M4.4 6.6c4.4 3.2 4.4 7.6 0 10.8M19.6 6.6c-4.4 3.2-4.4 7.6 0 10.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
let prefs={sport:'pickleball',zip:'',radius:5,lat:null,lng:null,view:'list'};try{Object.assign(prefs,JSON.parse(localStorage.getItem('cn-prefs')||'{}'))}catch(e){}
if(prefs.sport!=='tennis')prefs.sport='pickleball';if(![1,2,5,10].includes(prefs.radius))prefs.radius=5;if(prefs.view!=='map')prefs.view='list';
const savePrefs=()=>{try{const c=JSON.parse(localStorage.getItem('cn-prefs')||'{}')||{};localStorage.setItem('cn-prefs',JSON.stringify({...c,...prefs}))}catch(e){}};
const miles=(a,b,c,d)=>{const R=3958.8,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
let msg='';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let rows=null,err='',updated=null,tried=false,reps=[];
const slug=new URLSearchParams(location.search).get('park');
async function load(){
  const {data,error}=await sb.rpc('park_counts',{p_sport:prefs.sport});
  if(error){err=error.message;rows=rows||[]}else{err='';rows=data;updated=new Date()}
  if(slug&&!err){const rr=await sb.rpc('park_reports',{p_slug:slug,p_sport:prefs.sport});reps=rr.data||[]}
  if(slug&&!err&&!(rows||[]).some(r=>r.slug===slug)&&!tried){tried=true;prefs.sport=prefs.sport==='tennis'?'pickleball':'tennis';savePrefs();rows=null;return load()}
  render();
}
function view(){
  let list=(rows||[]).map(r=>({...r,d:(prefs.lat!=null&&r.lat!=null)?miles(prefs.lat,prefs.lng,r.lat,r.lng):null}));
  const located=prefs.lat!=null;
  const all=list.length;
  if(located)list=list.filter(r=>r.d<=prefs.radius).sort((x,y)=>x.d-y.d);
  return {list,all,located};
}
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-new Date(t))/60000));return m<1?'just now':m+' min ago'};
function renderPark(){
  const feat=(rows||[]).find(r=>r.slug===slug);
  let h=`<a class="head" href="./" aria-label="CourtPulse home" style="text-decoration:none;color:inherit"><img src="icon.png" alt="" width="36" height="36"><b class="sg" style="font-size:20px">CourtPulse</b></a>
  <div class="seg" role="group" aria-label="Sport"><button aria-pressed="${prefs.sport==='pickleball'}" data-sport="pickleball">${PB}Pickleball</button><button aria-pressed="${prefs.sport==='tennis'}" data-sport="tennis">${TN}Tennis</button></div>`;
  if(err)h+=`<div class="card" role="alert"><b>Couldn't load counts</b><div class="muted">${esc(err)}</div></div>`;
  else if(!rows)h+='<div class="muted">Loading…</div>';
  else if(!feat)h+=`<div class="card"><b>No ${prefs.sport} courts here</b><div class="muted">Try the other sport, or find another park.</div></div>`;
  else{
    h+=`<div class="card feat"><div class="muted"><span class="live">Live</span> · ${feat.courts} ${prefs.sport} courts</div><b class="sg" style="font-size:22px">${esc(feat.name)}</b><div class="row2"><div><div class="big">${Number(feat.avg_playing)}</div><div class="muted">playing now</div></div><div><div class="big" style="color:var(--ink)">${Number(feat.avg_waiting)}</div><div class="muted">waiting</div></div></div><div class="muted">${Number(feat.report_count)?'Average of '+Number(feat.report_count)+' report'+(feat.report_count==1?'':'s')+' in the last hour':'No reports in the last hour. Be the first!'}</div><a class="btn" href="checkin.html?park=${encodeURIComponent(slug)}">Share update</a></div>`;
    h+=`<b class="sg">Who updated</b>`;
    h+=reps.length?reps.map(r=>`<div class="card" style="flex-direction:row;justify-content:space-between;align-items:center"><div><b>${esc(r.who)}</b><div class="muted">${ago(r.created_at)}</div></div><span class="muted">${r.playing} playing · ${r.waiting} waiting</span></div>`).join(''):'<div class="muted">No updates in the last hour.</div>';
  }
  app.innerHTML=h;
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();rows=null;reps=[];tried=true;render();load()});
}
function render(){
  if(slug)return renderPark();
  let {list,all,located}=view();
  const feat=slug?(rows||[]).find(r=>r.slug===slug):null;
  if(feat)list=list.filter(r=>r.slug!==slug);
  const tot=list.reduce((a,r)=>a+Number(r.avg_playing),0);
  let h=`<div class="head"><img src="icon.png" alt="" width="36" height="36"><b class="sg" style="font-size:20px">CourtPulse</b></div>
  <div class="seg" role="group" aria-label="Sport"><button aria-pressed="${prefs.sport==='pickleball'}" data-sport="pickleball">${PB}Pickleball</button><button aria-pressed="${prefs.sport==='tennis'}" data-sport="tennis">${TN}Tennis</button></div>
  ${feat?`<div class="card feat"><div class="muted"><span class="live">Live</span> · ${prefs.sport==='tennis'?'Tennis':'Pickleball'} · ${feat.courts} courts</div><b class="sg" style="font-size:22px">${esc(feat.name)}</b><div class="row2"><div><div class="big">${Number(feat.avg_playing)}</div><div class="muted">playing now</div></div><div><div class="big" style="color:var(--ink)">${Number(feat.avg_waiting)}</div><div class="muted">waiting</div></div></div><div class="muted">${Number(feat.report_count)?'Average of '+Number(feat.report_count)+' report'+(feat.report_count==1?'':'s')+' in the last hour':'No reports in the last hour. Be the first!'}</div><a class="btn" href="checkin.html?park=${encodeURIComponent(feat.slug)}">Share update</a></div>`:''}
  <form id="zipf" class="zip"><input id="zip" inputmode="numeric" maxlength="5" placeholder="Enter ZIP code" aria-label="ZIP code" value="${esc(prefs.zip||'')}"><button class="go" type="submit">${located?'Change ZIP':'Find parks'}</button></form>
  <div class="muted"><button class="lnk" id="loc" type="button">Use my location</button>${located?' · <button class="lnk" id="clr" type="button">Show all parks</button>':''}</div>
  ${located?`<div class="chips" role="group" aria-label="Distance">${[1,2,5,10].map(r=>`<button type="button" aria-pressed="${prefs.radius===r}" data-r="${r}">${r} mi</button>`).join('')}</div>`:''}
  <div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="${prefs.view==='list'}" data-view="list">List</button><button type="button" aria-pressed="${prefs.view==='map'}" data-view="map">Map</button></div>
  ${msg?`<div class="muted" role="alert" style="color:#B3261E">${esc(msg)}</div>`:''}
  `;
  if(err)h+=`<div class="card" role="alert"><b>Couldn't load counts</b><div class="muted">${esc(err)}</div></div>`;
  else if(rows&&!list.length&&!(feat&&!located))h+=`<div class="card"><b>No ${prefs.sport} parks within ${prefs.radius} mi</b><div class="muted">${all?'Try a larger distance, or show all parks.':'No parks for this sport yet.'}</div></div>`;
  if(prefs.view==='map'){if(rows&&list.length)h+='<div id="map" class="mapbox" role="region" aria-label="Map of parks"></div>'}
  else list.forEach(r=>{const mx=r.courts*4,n=Number(r.avg_playing);
    h+=`<a class="card" href="?park=${encodeURIComponent(r.slug)}"><div class="row"><b class="sg" style="font-size:16px">${esc(r.name)}</b><span class="num">${n}</span></div><div class="muted">${r.d!=null?r.d.toFixed(1)+' mi · ':''}${r.courts} courts · ${Number(r.avg_waiting)} waiting · ${Number(r.report_count)?Number(r.report_count)+' report'+(r.report_count==1?'':'s')+' in the last hour':'no recent reports'}</div><div class="bar"><i style="width:${Math.min(100,n/mx*100)}%"></i></div></a>`});
  const first=list[0]?list[0].slug:'border-park';
  h+=`<a class="btn" href="checkin.html?park=${encodeURIComponent(first)}">Check in</a><div class="muted" style="text-align:center">Averages of player reports from the last hour. Refreshes every 30 seconds.</div>`;
  app.innerHTML=h;
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{prefs.view=b.dataset.view;savePrefs();render()});
  if(prefs.view==='map'&&document.getElementById('map')&&window.L){try{
    if(window._map){window._map.remove();window._map=null}
    const m=L.map('map',{scrollWheelZoom:false});window._map=m;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(m);
    const pts=[];
    list.filter(r=>r.lat!=null).forEach(r=>{pts.push([r.lat,r.lng]);
      L.marker([r.lat,r.lng],{icon:L.divIcon({className:'',html:`<div class="mpin">${Number(r.avg_playing)}</div>`,iconSize:[44,32],iconAnchor:[22,16]})}).addTo(m)
       .bindPopup(`<b>${esc(r.name)}</b><br>${Number(r.avg_playing)} playing · ${Number(r.avg_waiting)} waiting${r.d!=null?'<br>'+r.d.toFixed(1)+' mi':''}<br><a href="?park=${encodeURIComponent(r.slug)}">View park</a>`)});
    if(located){L.circleMarker([prefs.lat,prefs.lng],{radius:8,color:'#fff',weight:3,fillColor:'#5CA8FF',fillOpacity:1}).addTo(m).bindPopup('You are here');pts.push([prefs.lat,prefs.lng])}
    if(pts.length)m.fitBounds(pts,{padding:[30,30],maxZoom:14});else m.setView([33.95,-117.6],11)}catch(e){}}
  app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();rows=null;render();load()});
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{prefs.radius=+b.dataset.r;savePrefs();render()});
  document.getElementById('zipf').onsubmit=async e=>{e.preventDefault();const z=document.getElementById('zip').value.trim();
    if(!/^\d{5}$/.test(z)){msg='Enter a 5-digit ZIP code.';return render()}
    try{const r=await fetch('https://api.zippopotam.us/us/'+z);if(!r.ok)throw 0;const j=await r.json();const p=j.places[0];
      prefs.zip=z;prefs.lat=parseFloat(p.latitude);prefs.lng=parseFloat(p.longitude);msg='';savePrefs()}
    catch(_){msg='Could not find that ZIP code.'}render()};
  const loc=document.getElementById('loc');if(loc)loc.onclick=()=>{if(!navigator.geolocation){msg='Location is not available in this browser.';return render()}
    navigator.geolocation.getCurrentPosition(p=>{prefs.lat=p.coords.latitude;prefs.lng=p.coords.longitude;prefs.zip='';msg='';savePrefs();render()},()=>{msg='Could not get your location. Enter a ZIP code instead.';render()})};
  const clr=document.getElementById('clr');if(clr)clr.onclick=()=>{prefs.lat=null;prefs.lng=null;prefs.zip='';savePrefs();render()};
}
render();load();setInterval(load,30000);
</script></body></html>
