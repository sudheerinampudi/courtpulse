<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CourtPulse Check In</title>
<link rel="icon" href="favicon.png?v=4"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
.topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;background:var(--page);padding:8px 0}.homebtn{min-height:40px;padding:0 14px;border:1px solid var(--outline);border-radius:20px;background:#fff;color:var(--ink);font:600 13px Inter;text-decoration:none;display:flex;align-items:center;gap:6px}
:root{--page:#F6F8EF;--ring:#DCE5D0;--ink:#15332B;--muted:#5E7168;--outline:#B4C4AA;--lime:#D9F24A;--green:#1F6B3F;--err:#B3261E}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.sg,h1,h2{font-family:'Space Grotesk',sans-serif}
main{max-width:440px;margin:0 auto;padding:20px 20px 90px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{font-size:28px;margin:0;line-height:1.1}
.card{background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.btn{min-height:52px;border:none;border-radius:16px;background:var(--lime);color:#0F2A24;font:700 16px 'Space Grotesk';cursor:pointer;width:100%}
.btn.alt{background:#fff;border:1px solid var(--outline);color:var(--ink);font:600 14px Inter}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}.err{color:var(--err);font-size:13px;min-height:1em}
input{width:100%;min-height:48px;border:1px solid var(--outline);border-radius:12px;padding:0 14px;font:400 16px Inter;background:#fff;color:var(--ink)}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}.row{display:flex;gap:10px}.fld{flex:1}
.seg{display:flex;background:#fff;box-shadow:0 0 0 1px var(--ring);border-radius:24px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border:none;border-radius:20px;background:transparent;color:var(--ink);font:600 14px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.step{display:flex;align-items:center;justify-content:space-between}
.stick{position:sticky;bottom:0;z-index:4;background:linear-gradient(rgba(246,248,239,0),var(--page) 28%);padding:14px 0 8px}
.cnt{padding:10px 14px;gap:2px}.cnt .step button{width:44px;height:44px;font-size:24px}.cnt .step .n{font-size:40px}
.step .n{font:700 60px 'Space Grotesk';color:var(--green);letter-spacing:-.03em}
.step button{width:56px;height:56px;border-radius:50%;border:1px solid var(--outline);background:#fff;font:28px 'Space Grotesk';cursor:pointer;color:var(--ink)}
.step button.p{background:var(--lime);border:none;font-weight:700}.step button:disabled{opacity:.35}
.pill{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:24px;font:600 14px Inter;transition:opacity .5s}
.head{display:flex;align-items:center;gap:10px}.head img{display:block}
a.lnk,button.lnk{background:none;border:none;color:var(--green);font:600 13px Inter;cursor:pointer;padding:0;text-decoration:underline}
[hidden]{display:none!important}
.mtr{display:flex;gap:4px;margin-top:2px}.mtr i{flex:1;height:8px;border-radius:4px;background:#E3E8E2}.lvl{font:700 34px/1.1 'Space Grotesk';letter-spacing:-.02em}.lvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lvb{min-height:64px;border:2px solid var(--ring);background:#fff;border-radius:14px;padding:8px 10px;text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}.lvb b{font:700 16px 'Space Grotesk'}.lvb span{font-size:11.5px;color:var(--muted)}.lvb[aria-pressed=true]{border-color:currentColor;background:#F6FAF4}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Config: paste your Supabase Project URL below ===== */
const SUPABASE_URL = 'https://wjedvyqtqgvclxxsxyox.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EDOf8NAuJK8AbWhDLKzjmQ_gNcBpSb6'; // publishable key: safe in a web page
/* ========================================================= */
const PB='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#FFA03A" stroke="#15332B" stroke-width="1.5"/><g fill="#15332B"><circle cx="12" cy="7" r="1.4"/><circle cx="7.4" cy="10.4" r="1.4"/><circle cx="16.6" cy="10.4" r="1.4"/><circle cx="9.2" cy="15.8" r="1.4"/><circle cx="14.8" cy="15.8" r="1.4"/><circle cx="12" cy="12" r="1.4"/></g></svg>';
const TN='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#D5E83A" stroke="#15332B" stroke-width="1.5"/><path d="M4.4 6.6c4.4 3.2 4.4 7.6 0 10.8M19.6 6.6c-4.4 3.2-4.4 7.6 0 10.8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=$('#app');
const slug=new URLSearchParams(location.search).get('park')||'border-park';
let prefs={sport:'pickleball'};try{Object.assign(prefs,JSON.parse(localStorage.getItem('cn-prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{const c=JSON.parse(localStorage.getItem('cn-prefs')||'{}')||{};localStorage.setItem('cn-prefs',JSON.stringify({...c,sport:prefs.sport}))}catch(e){}};
const S={arrive:'',toastText:'Update shared',live:null,step:'loading',park:null,parks:[],picking:false,user:null,email:'',first:'',last:'',err:'',busy:false,lv:null,errCome:'',toast:false,recent:[]};
let sb=null;
const head=()=>`<div class="topbar"><a class="head" href="./" aria-label="CourtPulse home" style="text-decoration:none;color:inherit"><img src="icon.png?v=4" alt="" width="40" height="40"><b class="sg" style="font-size:20px">CourtPulse</b></a><a class="homebtn" href="./"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</a></div>`;
const courts=()=>S.park?(prefs.sport==='tennis'?S.park.tennis_courts:S.park.pickleball_courts):0;
const mp=()=>courts()*4,mw=()=>courts()*2;
const LV=[{n:'Free',c:'#1F9D55'},{n:'Moderate',c:'#8AA81B'},{n:'Busy',c:'#E08A12'},{n:'Very busy',c:'#D23B2E'}];
const lvOf=a=>a==null||a===''?null:Math.max(0,Math.min(3,Math.round(Number(a))));
function lvHint(i,courts){const cap=courts*4,a=Math.floor(cap*.25),b=Math.max(a+1,Math.floor(cap*.6)),top=Math.max(b+1,cap-1);
 const r=(x,y)=>x>=y?`${y}`:`${x}-${y}`;
 return [`About ${r(0,a)} players`,`About ${r(a+1,b)} players`,`About ${r(b+1,top)} players`,'Courts full, people waiting'][i]}
function meter(i){return `<div class="mtr" aria-hidden="true">${[0,1,2,3].map(k=>`<i style="${k<=i?'background:'+LV[i].c:''}"></i>`).join('')}</div>`}
const comingTxt=n=>{n=Number(n)||0;return n>0?(n===1?'1 person':n+' people')+' coming later today':''};
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function suggestion(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;
  if(h<7)return '07:00';
  if(h>=12&&h<19)return '19:00';
  const nx=d.getHours()+1;return nx>=24?null:String(nx).padStart(2,'0')+':00'}
const t12=v=>{const [h,m]=v.split(':').map(Number),d=new Date();d.setHours(h,m,0,0);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const fmtT=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
S.joinNote='';{const j=new URLSearchParams(location.search).get('join');const d=j?new Date(j):null;if(d&&!isNaN(d)&&d.getTime()>Date.now()-10*60000){S.arrive=hhmm(d);S.joinNote='Joining at '+fmtT(d)+'. Tap I\'m coming to confirm.'}}
const fullName=u=>{const m=u?.user_metadata||{};return [m.first_name,m.last_name].filter(Boolean).join(' ')||(u?.email||'').split('@')[0]};

async function init(){
  if(SUPABASE_URL.startsWith('PASTE')){app.innerHTML=head()+'<div class="card"><b>Setup needed</b><div class="muted">Add your Supabase Project URL at the top of checkin.html.</div></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
  const {data:pk,error}=await sb.from('parks').select('*').eq('slug',slug).maybeSingle();
  if(error||!pk){S.step='nopark';return render()}
  S.park=pk;fixSport();
  const {data:all}=await sb.from('parks').select('*').order('name');S.parks=all||[pk];
  const {data:{session}}=await sb.auth.getSession();S.user=session?.user&&!session.user.is_anonymous?session.user:null;
  sb.auth.onAuthStateChange((_e,s)=>{const had=!!S.user;S.user=s?.user&&!s.user.is_anonymous?s.user:null;if(S.user&&!had){S.step='checkin';render()}});
  S.step=S.user?'checkin':'signin';render();
}
function fixSport(){const p=S.park;if(!(p.tennis_courts>0)&&prefs.sport==='tennis')prefs.sport='pickleball';if(!(p.pickleball_courts>0)&&prefs.sport==='pickleball')prefs.sport='tennis'}
async function loadLive(){if(!sb||!S.park)return;const {data}=await sb.rpc('park_counts',{p_sport:prefs.sport});S.live=(data||[]).find(r=>r.slug===S.park.slug)||null;if(S.step!=='loading')render()}
function liveCard(){const l=S.live;if(!l)return '';const n=Number(l.report_count),L=lvOf(l.avg_level);return `<div class="card"><div class="muted"><span style="color:#1F9D55;font-weight:600">● Live</span> · ${esc(S.park.name)}</div>${L==null?'<div class="lvl" style="color:var(--muted)">No data</div>':`<div class="lvl" style="color:${LV[L].c}">${LV[L].n}</div>${meter(L)}<div class="muted">${lvHint(L,l.courts)}</div>`}<div class="muted">${n?'Average of '+n+' report'+(n==1?'':'s')+' in the last 2 hours':'No reports in the last 2 hours'}</div>${Number(l.arriving_today)?`<div class="muted" style="color:#2C5A12;font-weight:600">${comingTxt(l.arriving_today)}</div>`:''}</div>`}
function sportSeg(){const p=S.park;return `<div class="seg" role="group" aria-label="Sport">${p.pickleball_courts>0?`<button aria-pressed="${prefs.sport==='pickleball'}" data-sport="pickleball">${PB}Pickleball</button>`:''}${p.tennis_courts>0?`<button aria-pressed="${prefs.sport==='tennis'}" data-sport="tennis">${TN}Tennis</button>`:''}</div>`}
function render(){
 let h=head();
 if(S.step==='loading')h+='<div class="muted">Loading…</div>';
 else if(S.step==='nopark')h+='<div class="card"><b>Park not found</b><div class="muted">Check the QR code on the sign, or the link you were given.</div></div>';
 else if(S.step==='signin')h+=`${liveCard()}<h1>Sign in to share an update</h1><div class="muted">${esc(S.park.name)}. No app needed.</div>
    <div class="row"><div class="fld"><label for="fn">First name</label><input id="fn" autocomplete="given-name" value="${esc(S.first)}"></div><div class="fld"><label for="ln">Last name</label><input id="ln" autocomplete="family-name" value="${esc(S.last)}"></div></div>
  <div><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="${esc(S.email)}"></div>
  <div class="err" role="alert">${esc(S.err)}</div>
  <button class="btn" id="send" ${S.busy?'disabled':''}>Continue with email</button><div class="muted">We only collect first name, last name and email.</div>`;
 else if(S.step==='code')h+=`<h1>Check your email</h1><div class="muted">We sent a code to ${esc(S.email)}. Enter it to confirm the address is yours.</div><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Code" aria-label="Verification code"><div class="err" role="alert">${esc(S.err)}</div><button class="btn" id="verify" ${S.busy?'disabled':''}>Verify</button><button class="lnk" id="back">Change email</button>`;
 else if(S.step==='checkin'){
  h+=`<div class="muted">Signed in as ${esc(fullName(S.user))} · <button class="lnk" id="out">Sign out</button></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="muted">Reporting for</div><b class="sg" style="font-size:17px">${esc(S.park.name)}</b><div class="muted">${courts()} ${prefs.sport} courts</div></div><button class="btn alt" id="chg" style="width:auto;padding:0 14px;min-height:44px;border-radius:22px">${S.picking?'Close':'Change park'}</button></div>${S.picking?`<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${S.parks.map(p=>`<button class="btn alt" data-park="${esc(p.slug)}" style="text-align:left;padding:0 14px;${p.slug===S.park.slug?'border-color:var(--green);font-weight:700':''}">${esc(p.name)}</button>`).join('')}</div>`:''}</div>${sportSeg()}
  <div class="card cnt"><b class="sg" style="font-size:16px">Coming later?</b><div class="muted" style="font-size:12px">Let others know when you plan to arrive. This is separate from the busy level.</div>${S.joinNote?`<div style="color:#2C5A12;font-weight:600;font-size:13px">${esc(S.joinNote)}</div>`:''}<div style="display:flex;gap:8px;align-items:center;margin-top:4px"><input id="arr" type="time" aria-label="Estimated arrival time" value="${esc(S.arrive||suggestion()||'')}" style="flex:1;min-height:44px"><button class="btn alt" id="come" type="button" ${S.busy?'disabled':''} style="width:auto;padding:0 14px;min-height:44px;border-radius:22px">I'm coming</button></div>${S.errCome?`<div class="err" role="alert">${esc(S.errCome)}</div>`:''}</div>
  <div class="card cnt"><b class="sg" style="font-size:16px">How busy is it right now?</b><div class="lvs">${LV.map((l,k)=>`<button type="button" class="lvb" data-lv="${k}" ${S.busy?'disabled':''} aria-pressed="${S.lv===k}" style="${S.lv===k?'color:'+l.c:''}"><b style="color:${l.c}">${l.n}</b><span>${lvHint(k,courts())}</span></button>`).join('')}</div></div>
  <div class="err" role="alert">${esc(S.err)}</div><div class="muted" style="text-align:center">Tap a level to share it. Others see the average of recent updates.</div>
  ${S.recent.length?`<b class="sg">Today's updates</b>${S.recent.map(r=>`<div class="card" style="flex-direction:row;justify-content:space-between"><b>${esc(r.reporter_name)}</b><span class="muted">${r.level!=null?`<b style="color:${LV[r.level].c}">${LV[r.level].n}</b>`:`${r.playing} playing · ${r.waiting} waiting`}</span></div>`).join('')}`:''}`}
 if(S.toast)h+='<div class="pill" id="pill">'+esc(S.toastText)+'</div>';
 app.innerHTML=h;wire();
}
function wire(){
 const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
 app.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{prefs.sport=b.dataset.sport;savePrefs();S.recent=[];S.live=null;render();loadRecent();loadLive()});
 app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=async()=>{if(S.busy)return;S.lv=Number(b.dataset.lv);S.busy=true;S.err='';render();
  const {error}=await sb.from('reports').insert({park_slug:S.park.slug,sport:prefs.sport,reporter_name:fullName(S.user),level:S.lv});
  S.busy=false;if(error){S.lv=null;S.err=error.message;return render()}
  S.toastText='Thanks! Update shared';S.toast=true;render();await loadRecent();const p=$('#pill');setTimeout(()=>{p&&(p.style.opacity=0)},1800);setTimeout(()=>{S.toast=false;S.lv=null;render()},2400)});
 on('send',async()=>{S.first=$('#fn').value.trim();S.last=$('#ln').value.trim();S.email=$('#em').value.trim();
  if(!S.first||!S.last||!/^\S+@\S+\.\S+$/.test(S.email)){S.err='Enter your first name, last name and a valid email.';return render()}
  S.busy=true;S.err='';render();
  const {error}=await sb.auth.signInWithOtp({email:S.email,options:{shouldCreateUser:true,data:{first_name:S.first,last_name:S.last}}});
  S.busy=false;if(error){S.err=error.message}else S.step='code';render()});
 on('verify',async()=>{const t=$('#code').value.trim();if(!t){S.err='Enter the code from your email.';return render()}
  S.busy=true;S.err='';render();
  let {data,error}=await sb.auth.verifyOtp({email:S.email,token:t,type:'email'});
  if(error){const r2=await sb.auth.verifyOtp({email:S.email,token:t,type:'signup'});if(!r2.error){data=r2.data;error=null}}
  S.busy=false;if(error){S.err='That code did not work. Check it and try again.';render()}else{S.user=data.user;S.step='checkin';render();loadRecent()}});
 {const a=$('#arr');if(a)a.oninput=a.onchange=()=>{S.arrive=a.value||''}}
 on('come',async()=>{const a=$('#arr');const v=(a&&a.value)||S.arrive||'';S.errCome='';
  if(!v){S.errCome='Pick an arrival time.';return render()}
  S.arrive=v;const [hh,mm]=v.split(':').map(Number);const d=new Date();d.setHours(hh,mm,0,0);
  if(d.getTime()<Date.now()-10*60000){S.errCome='That time has already passed. Pick a later time.';return render()}
  S.busy=true;render();
  const {error}=await sb.from('arrivals').insert({park_slug:S.park.slug,sport:prefs.sport,reporter_name:fullName(S.user),arriving_at:d.toISOString()});
  S.busy=false;if(error){S.errCome=error.message;return render()}
  S.arrive='';S.joinNote='';S.toastText='Arrival shared';S.toast=true;render();const p=$('#pill');setTimeout(()=>{p&&(p.style.opacity=0)},1800);setTimeout(()=>{S.toast=false;render()},2400)});
 on('chg',()=>{S.picking=!S.picking;render()});
 app.querySelectorAll('[data-park]').forEach(b=>b.onclick=()=>{const p=S.parks.find(x=>x.slug===b.dataset.park);if(!p)return;S.park=p;S.picking=false;fixSport();S.recent=[];S.live=null;loadLive();S.lv=null;try{history.replaceState(null,'','?park='+encodeURIComponent(p.slug))}catch(e){}render();loadRecent()});
 on('back',()=>{S.step='signin';S.err='';render()});
 on('out',async()=>{await sb.auth.signOut();S.user=null;S.step='signin';render()});
}
async function loadRecent(){if(!S.user||!S.park)return;
 const {data}=await sb.from('reports').select('reporter_name,level,playing,waiting,created_at').eq('park_slug',S.park.slug).eq('sport',prefs.sport).order('created_at',{ascending:false}).limit(30);
 S.recent=data||[];if(S.step==='checkin'&&!S.toast)render()}
init().then(()=>{loadRecent();loadLive();setInterval(loadLive,30000)});
</script></body></html>
